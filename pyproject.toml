[project]
name = "olympicscope"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "pandas>=3.1.0",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint.isort]
# Módulos do próprio projeto. Os do app/ são importados sem prefixo porque o
# `streamlit run app/app.py` coloca a pasta app/ no caminho do Python.
known-first-party = ["app", "pipeline", "ui", "consultas", "dados", "formatacao", "componentes", "paginas"]
